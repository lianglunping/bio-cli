name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.8'
          - os: ubuntu-22.04
            python: '3.12'
          - os: macos-14
            python: '3.12'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd samtools bcftools tabix gzip bzip2 xz-utils
      - name: Install macOS test dependencies
        if: runner.os == 'macOS'
        run: brew install zstd samtools bcftools htslib gzip xz
      - name: Record native dependency versions
        shell: bash
        run: |
          python --version
          for tool in tar gzip bzip2 xz zstd samtools bcftools bgzip; do
            command -v "$tool"
            "$tool" --version </dev/null
          done
      - name: Run synthetic regressions
        run: python -m unittest discover -s tests -v
