name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.8'
          - os: ubuntu-22.04
            python: '3.12'
          - os: macos-14
            python: '3.12'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd samtools bcftools tabix gzip bzip2 xz-utils libarchive-tools
      - name: Check old system RAR5 backend and build supported bsdtar
        if: runner.os == 'Linux'
        run: |
          if bsdtar --version | grep -q 'libarchive 3.6.0'; then
            if python bio_cli.py unpackz tests/fixtures/test_read_format_rar5_compressed.rar -C "$RUNNER_TEMP/unsafe" 2>"$RUNNER_TEMP/refusal"; then exit 1; fi
            grep -F 'libarchive 3.7.4+' "$RUNNER_TEMP/refusal"
            test ! -e "$RUNNER_TEMP/unsafe"
          fi
          cd "$RUNNER_TEMP"
          curl -fsSL https://github.com/libarchive/libarchive/releases/download/v3.8.11/libarchive-3.8.11.tar.xz -o libarchive.tar.xz
          echo 'a3dc0872b1b39da34dc18ef1b944f0f11ffd37425d70ae04be679279f1cf43d2  libarchive.tar.xz' | sha256sum -c -
          tar xf libarchive.tar.xz
          cmake -S libarchive-3.8.11 -B archive-build -DENABLE_TEST=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build archive-build --target bsdtar --parallel 4
          echo "$RUNNER_TEMP/archive-build/bin" >> "$GITHUB_PATH"
      - name: Install macOS test dependencies
        if: runner.os == 'macOS'
        run: |
          brew install zstd samtools bcftools htslib gzip xz libarchive
          echo "$(brew --prefix libarchive)/bin" >> "$GITHUB_PATH"
      - name: Record native dependency versions
        shell: bash
        run: |
          python --version
          for tool in bsdtar tar gzip bzip2 xz zstd samtools bcftools bgzip; do
            command -v "$tool"
            "$tool" --version </dev/null
          done
      - name: Run synthetic regressions
        run: python -m unittest discover -s tests -v
